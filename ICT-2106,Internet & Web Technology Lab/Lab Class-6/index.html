<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<input class="form-control form-control-lg" type="text" placeholder=".form-control-lg" aria-label=".form-control-lg example">
<input class="form-control" type="text" placeholder="Default input" aria-label="default input example">
<input class="form-control form-control-sm" type="text" placeholder=".form-control-sm" aria-label=".form-control-sm example">
<link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <div class="container">
    <div class="color">
      <div class="container-sm">
        
        <form>
            <header class="text-center">ID FORM</header>
        <div class="row" >
              <div class="col">
                <label for="staticEmail" class="form-label">Email</label>
                <input type="text" class="form-control" id="staticEmail" value="example@gmail.com" >
              </div>
              <div class="col">
                <label for="inputPassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="inputPassword" >
              </div>
        </div>

        <div class="row">
            <div class="col">
              <label for="staticDepartment" class="form-label">Department</label>
              <input class="form-control" list="datalistOptions" id="staticDepartment" placeholder="Type to search..." >
              <datalist id="datalistOptions">
                <option value="Statistics">
                <option value="Maths">
                <option value="IIT">
                <option value="Social Science">
                
              </datalist>
            </div>
            <div class="col">
              <label for="inputPassword" class="form-label">Session</label>
              <input type="password" class="form-control" id="inputPassword">
            </div>
      </div>

      <div class="row">
        <div class="col">
          <label for="staticEmail" class="form-label">Batch</label>
          <input type="text" readonly class="form-control" id="staticEmail" value="">
        </div>
        <div class="col">
          <label for="inputPassword" class="form-label">Class ID</label>
          <input type="password" class="form-control" id="inputPassword">
        </div>
    </div>
</div>
<!-- submit button -->
<div class="row mt-4">
  <div class="col text-center">
    <button type="submit" class="btn btn-primary">Submit</button>
  </div>
</div> 

<!-- checkbox -->
<div class="form-check">
    <input class="form-check-input" type="checkbox" value="" id="checkDefault">
    <label class="form-check-label" for="checkDefault">
      Default checkbox
    </label>
  </div>
  <div class="form-check">
    <input class="form-check-input" type="checkbox" value="" id="checkChecked" checked>
    <label class="form-check-label" for="checkChecked">
      Checked checkbox
    </label>
  </div>

</form>
</div>
</div>

      
</body>
</html>
